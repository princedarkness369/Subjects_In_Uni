<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS Chapter 1 — Interrogation Deck</title>
<style>
:root{
  --bg-0:#050b14;
  --bg-1:#0a1626;
  --bg-2:#0f2138;
  --panel:#0d1c30;
  --line:#1c3350;
  --cyan:#3fe8e0;
  --cyan-dim:#1f9490;
  --blue:#4f8dff;
  --blue-deep:#1b3a73;
  --text:#dbe9f5;
  --text-dim:#7f9bb8;
  --ok:#39d98a;
  --bad:#ff5c72;
  --warn:#ffb454;
  --mono:'JetBrains Mono','Courier New',monospace;
  --serif:'Iowan Old Style','Georgia',serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 700px at 15% -10%, #10233d 0%, transparent 60%),
    radial-gradient(1000px 600px at 110% 10%, #0c2a3a 0%, transparent 55%),
    var(--bg-0);
  color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  line-height:1.5;
}
.wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}
::selection{background:var(--cyan);color:#00201e;}

/* Circuit motif background lines */
.circuit-bg{
  position:fixed;inset:0;z-index:-1;opacity:.35;pointer-events:none;
  background-image:
    linear-gradient(90deg, rgba(63,232,224,0.035) 1px, transparent 1px),
    linear-gradient(0deg, rgba(63,232,224,0.035) 1px, transparent 1px);
  background-size:42px 42px;
}

header.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 4px 20px;border-bottom:1px solid var(--line);margin-bottom:26px;
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);letter-spacing:.5px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);}
.brand b{color:var(--cyan);font-weight:700;}
.brand span.sub{color:var(--text-dim);font-size:12.5px;}
nav.pill{
  display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;
  font-family:var(--mono);font-size:12px;
}
nav.pill span{padding:6px 12px;border-radius:999px;color:var(--text-dim);}
nav.pill span.active{background:var(--blue-deep);color:var(--cyan);}

/* Home */
.hero{padding:36px 0 10px;}
.eyebrow{font-family:var(--mono);color:var(--cyan-dim);letter-spacing:3px;font-size:12px;text-transform:uppercase;margin-bottom:14px;}
h1.title{
  font-family:var(--serif);font-size:44px;line-height:1.1;margin:0 0 16px;
  color:#f2f9ff;font-weight:600;
}
h1.title em{color:var(--cyan);font-style:normal;}
.lede{color:var(--text-dim);font-size:16px;max-width:620px;margin-bottom:30px;}

.chapter-map{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:22px 0 34px;
}
.chapter-map .node{
  border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),#0a1728);
  border-radius:10px;padding:12px 14px;font-size:13px;color:var(--text-dim);
  position:relative;overflow:hidden;
}
.chapter-map .node::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--cyan-dim);
}
.chapter-map .node b{display:block;color:var(--text);font-size:13.5px;margin-bottom:2px;}

.stat-row{display:flex;gap:14px;flex-wrap:wrap;margin:26px 0 34px;}
.stat{
  border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 18px;min-width:120px;
}
.stat .n{font-family:var(--mono);font-size:26px;color:var(--cyan);font-weight:700;}
.stat .l{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

.btn{
  appearance:none;border:none;cursor:pointer;font-family:'Segoe UI',sans-serif;font-weight:600;
  padding:14px 26px;border-radius:10px;font-size:15px;letter-spacing:.3px;transition:transform .12s ease, box-shadow .12s ease;
}
.btn-primary{background:linear-gradient(135deg,var(--cyan) 0%, var(--blue) 100%);color:#00151a;box-shadow:0 6px 24px -6px rgba(63,232,224,.45);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px -6px rgba(63,232,224,.6);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn-ghost:hover{border-color:var(--cyan-dim);color:var(--cyan);}
.btn-sm{padding:9px 16px;font-size:13px;border-radius:8px;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* Setup page */
.card{
  border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:26px;margin-bottom:20px;
}
.card h2{margin:0 0 4px;font-family:var(--serif);font-weight:600;font-size:22px;color:#f2f9ff;}
.card .hint{color:var(--text-dim);font-size:13px;margin-bottom:18px;}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;}
.opt-btn{
  border:1px solid var(--line);background:#0a1728;color:var(--text-dim);border-radius:10px;padding:12px 8px;
  text-align:center;cursor:pointer;font-family:var(--mono);font-size:14px;
}
.opt-btn.sel{border-color:var(--cyan);color:var(--cyan);background:rgba(63,232,224,.08);box-shadow:0 0 0 1px var(--cyan) inset;}
.opt-btn:hover{border-color:var(--cyan-dim);}
.mode-row{display:flex;gap:12px;flex-wrap:wrap;}
.mode-card{
  flex:1;min-width:220px;border:1px solid var(--line);background:#0a1728;border-radius:12px;padding:16px;cursor:pointer;
}
.mode-card b{display:block;color:var(--text);margin-bottom:4px;}
.mode-card p{margin:0;color:var(--text-dim);font-size:12.5px;}
.mode-card.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset;background:rgba(79,141,255,.07);}

/* Exam page */
.exam-head{position:sticky;top:0;background:linear-gradient(180deg, var(--bg-0) 80%, transparent); padding:10px 0 14px;z-index:5;}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12.5px;color:var(--text-dim);margin-bottom:8px;}
.timer{color:var(--cyan);font-weight:700;}
.timer.low{color:var(--bad);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.progress-bar{height:6px;background:#0a1728;border-radius:999px;overflow:hidden;border:1px solid var(--line);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));transition:width .25s ease;}

.qtag{display:inline-flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-bottom:12px;}
.qtag .badge{padding:3px 9px;border-radius:999px;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.5px;}
.badge.easy{color:var(--ok);border-color:var(--ok);}
.badge.medium{color:var(--warn);border-color:var(--warn);}
.badge.hard{color:var(--bad);border-color:var(--bad);}
.badge.topic{color:var(--cyan);border-color:var(--cyan-dim);}

.qtext{font-size:19px;color:#f2f9ff;margin:0 0 20px;font-weight:500;line-height:1.45;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice{
  border:1px solid var(--line);background:#0a1728;border-radius:10px;padding:13px 16px;cursor:pointer;
  display:flex;gap:12px;align-items:flex-start;font-size:14.5px;
}
.choice .mark{width:20px;height:20px;flex:none;border-radius:5px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-dim);margin-top:1px;}
.choice.radio .mark{border-radius:50%;}
.choice:hover{border-color:var(--cyan-dim);}
.choice.chosen{border-color:var(--blue);background:rgba(79,141,255,.08);}
.choice.chosen .mark{background:var(--blue);border-color:var(--blue);color:#fff;}
.choice.correct{border-color:var(--ok);background:rgba(57,217,138,.09);}
.choice.correct .mark{background:var(--ok);border-color:var(--ok);color:#00170b;}
.choice.incorrect{border-color:var(--bad);background:rgba(255,92,114,.09);}
.choice.incorrect .mark{background:var(--bad);border-color:var(--bad);color:#1a0004;}

textarea.fillbox,input.fillbox{
  width:100%;background:#0a1728;border:1px solid var(--line);border-radius:10px;color:var(--text);
  padding:13px 14px;font-size:15px;font-family:inherit;
}
textarea.fillbox{min-height:80px;resize:vertical;}
.fillbox:focus{outline:none;border-color:var(--cyan);}

.match-row,.order-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);}
.match-row:last-child,.order-row:last-child{border-bottom:none;}
.match-left{flex:1;font-size:14px;color:var(--text);}
select.mselect{
  background:#0a1728;border:1px solid var(--line);color:var(--cyan);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:13px;min-width:170px;
}

.feedback-box{margin-top:18px;border-radius:10px;padding:14px 16px;font-size:13.5px;border:1px solid;}
.feedback-box.ok{border-color:var(--ok);background:rgba(57,217,138,.08);color:#c9ffe4;}
.feedback-box.bad{border-color:var(--bad);background:rgba(255,92,114,.08);color:#ffd6dc;}
.feedback-box b{display:block;margin-bottom:4px;font-size:14px;}

.nav-row{display:flex;justify-content:space-between;margin-top:26px;gap:10px;}
.nav-row .spacer{flex:1;}

/* Results */
.score-hero{text-align:center;padding:20px 0 10px;}
.score-ring{
  width:170px;height:170px;border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:conic-gradient(var(--cyan) calc(var(--pct)*1%), #0a1728 0);
  position:relative;
}
.score-ring::before{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--bg-0);}
.score-ring .num{position:relative;font-family:var(--mono);font-size:38px;font-weight:700;color:#f2f9ff;}
.score-ring .lbl{position:relative;font-size:12px;color:var(--text-dim);}
.pass-tag{display:inline-block;padding:6px 18px;border-radius:999px;font-family:var(--mono);font-weight:700;letter-spacing:1px;margin-top:6px;}
.pass-tag.pass{background:rgba(57,217,138,.15);color:var(--ok);border:1px solid var(--ok);}
.pass-tag.fail{background:rgba(255,92,114,.15);color:var(--bad);border:1px solid var(--bad);}

.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:26px;}
.metric{border:1px solid var(--line);background:#0a1728;border-radius:12px;padding:14px;text-align:center;}
.metric .v{font-family:var(--mono);font-size:22px;font-weight:700;}
.metric .k{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;margin-top:2px;}
.v.ok{color:var(--ok);}.v.bad{color:var(--bad);}.v.warn{color:var(--warn);}.v.cyan{color:var(--cyan);}

/* Review */
.rev-item{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
.rev-item .status{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid;text-transform:uppercase;letter-spacing:.5px;}
.status.right{color:var(--ok);border-color:var(--ok);}
.status.wrong{color:var(--bad);border-color:var(--bad);}
.status.skip{color:var(--text-dim);border-color:var(--line);}
.rev-q{font-size:15.5px;color:#f2f9ff;margin:8px 0 12px;font-weight:500;}
.rev-block{font-size:13.5px;margin-bottom:6px;}
.rev-block b{color:var(--text-dim);font-weight:600;margin-right:6px;}
.rev-ans{color:var(--text);}
.rev-explain{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:var(--text-dim);font-size:13px;}

footer.foot{text-align:center;color:var(--text-dim);font-size:12px;margin-top:50px;font-family:var(--mono);}

@media (max-width:600px){
  h1.title{font-size:32px;}
  .score-ring{width:140px;height:140px;}
}
.hidden{display:none !important;}
</style>
</head>

<div class="wrap">

 o:['True','False'],c:1,
 e:'The slides explicitly say there is "no universally accepted definition" of an operating system.'},

{t:'mcq',d:'medium',topic:'OS Definitions',q:'The chapter describes "the one program running at all times on the computer" as the:',

{t:'mcq',d:'medium',topic:'OS Definitions',q:'A program that ships with the operating system but is not part of the kernel is called a:',

{t:'mcq',d:'hard',topic:'OS Definitions',q:'According to the chapter, the concept of an operating system was "born" when:',

 e:'Slide 9 states the OS concept originated as fixed-use military computers evolved into general-purpose machines needing resource management and program control.'},

// ---------- Users' perspective / points of view (slide 8) ----------
{t:'mcq',d:'medium',topic:'Points of View',q:'According to the chapter, users of dedicated systems such as workstations:',
 o:['Have dedicated resources but frequently use shared resources from servers','Never use any shared resources','Always share a single mainframe CPU','Have no user interface at all'],c:0,
 e:'The slides state that workstation users have dedicated resources but frequently use shared resources from servers.'},

{t:'mcq',d:'easy',topic:'Points of View',q:'Which statement about mobile devices (smartphones, tablets) is TRUE according to the chapter?',
 o:['They are resource-poor and optimized for usability and battery life','They have unlimited resources compared to workstations','They never use touch-screen or voice interfaces','They always require a mainframe connection'],c:0,
 e:'The chapter describes mobile devices as resource-poor, optimized for usability and battery life, using interfaces like touch screens and voice recognition.'},

{t:'tf',d:'medium',topic:'Points of View',q:'True or False: Embedded computers in devices and automobiles, as described in the chapter, typically run with significant user intervention.',

// ---------- Computer System Organization / Interrupts (12-20) ----------
{t:'mcq',d:'easy',topic:'System Organization',q:'In the computer-system organization described in the chapter, CPUs and device controllers communicate through:',
 o:['A common bus providing access to shared memory','Separate dedicated memory for each device','A single serial cable','Direct wiring to the power supply'],c:0,
 e:'The slides describe one or more CPUs and device controllers connected through a common bus that provides access to shared memory.'},

{t:'select',d:'medium',topic:'System Organization',q:'Which of the following are true about I/O device controllers, according to the chapter? (select all that apply)',

 e:'The chapter states each controller manages a particular device type, has a local buffer, and has a corresponding OS device driver. Controllers do not execute user application code.'},

{t:'mcq',d:'medium',topic:'Interrupts',q:'How does a device controller inform the CPU that it has finished an operation?',
 o:['By causing an interrupt','By writing to the disk','By restarting the CPU','By sending an email to the OS log'],c:0,
 e:'The chapter states the device controller informs the CPU it has finished by causing an interrupt.'},

{t:'mcq',d:'medium',topic:'Interrupts',q:'Which statement correctly describes how an interrupt transfers control, per the chapter?',

{t:'fill',d:'medium',topic:'Interrupts',q:'Fill in the blank: A ______ or exception is a software-generated interrupt caused either by an error or a user request.',

{t:'mcq',d:'easy',topic:'Storage Structure',q:'According to the chapter, which is the only large storage media that the CPU can access directly?',
 o:['Main memory','Hard disk drives','Secondary storage tape','Cloud storage'],c:0,

{t:'tf',d:'easy',topic:'Storage Structure',q:'True or False: According to the chapter, main memory is typically volatile.',

{t:'mcq',d:'medium',topic:'Storage Structure',q:'What is secondary storage, as defined in the chapter?',

{t:'mcq',d:'medium',topic:'Storage Structure',q:'On a hard disk drive, the disk surface is logically divided into tracks, which are subdivided into:',

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pickExamSet(n){
  const easyN = Math.round(n*0.3);
  const hardN = Math.round(n*0.3);
  const medN = n - easyN - hardN;
  const byDiff = {easy:[], medium:[], hard:[]};
  BANK.forEach((q,i)=>byDiff[q.d].push({...q, id:'q'+i}));
  const pick = (arr,k)=> shuffle(arr).slice(0, Math.min(k, arr.length));
  let chosen = [
    ...pick(byDiff.easy, easyN),
    ...pick(byDiff.medium, medN),
    ...pick(byDiff.hard, hardN),
  ];
  // top-up if a bucket ran short
  if(chosen.length < n){
    const usedIds = new Set(chosen.map(q=>q.id));
    const rest = BANK.map((q,i)=>({...q,id:'q'+i})).filter(q=>!usedIds.has(q.id));
    chosen = chosen.concat(shuffle(rest).slice(0, n-chosen.length));
  }
  chosen = shuffle(chosen).slice(0,n);
  // shuffle option order for mcq/tf/select/compare, keep mapping correct
  chosen = chosen.map(q=>{
    const q2 = {...q};
    if(['mcq','tf','select','compare'].includes(q.t)){
      const idx = q.o.map((_,i)=>i);
      const sh = shuffle(idx);
      q2.o = sh.map(i=>q.o[i]);
      if(Array.isArray(q.c)){
        q2.c = q.c.map(orig=>sh.indexOf(orig)).sort((a,b)=>a-b);
      } else {
        q2.c = sh.indexOf(q.c);
      }
    }
    if(q.t==='match'){
      const rightItems = q.pairs.map(p=>p[1]);
      q2.rightShuffled = shuffle(rightItems);
    }
    if(q.t==='order'){
      const idx = q.steps.map((_,i)=>i);
      q2.displaySteps = shuffle(idx).map(i=>q.steps[i]);
      q2.displayOrigIndex = shuffle(idx); // not used directly, recompute below
    }
    return q2;
  });
  return chosen;
}

  state.page = p;

  window.scrollTo({top:0,behavior:'smooth'});
}

navPill.addEventListener('click', (e)=>{
  const p = e.target.getAttribute('data-p');
  if(!p) return;
  if(p==='exam' && state.examQuestions.length===0) return;
  if(p==='results' && !state.endTime) return;
  if(p==='review' && !state.endTime) return;
  setPage(p);
});

function updateNav(){
  [...navPill.children].forEach(c=>{
    c.classList.toggle('active', c.getAttribute('data-p')===state.page);

}

  if(state.page==='review') return renderReview();
}

  `;
  document.getElementById('countGrid').addEventListener('click', e=>{
    const el = e.target.closest('.opt-btn'); if(!el) return;
    state.setup.count = parseInt(el.getAttribute('data-count'));
    renderSetup();
  });
  document.getElementById('modeRow').addEventListener('click', e=>{
    const el = e.target.closest('.mode-card'); if(!el) return;
    state.setup.mode = el.getAttribute('data-mode');
    renderSetup();
  });
  const timerGrid = document.getElementById('timerGrid');
  if(timerGrid){
    timerGrid.addEventListener('click', e=>{
      const el = e.target.closest('.opt-btn'); if(!el) return;
      state.setup.timerMin = parseInt(el.getAttribute('data-timer'));
      renderSetup();
    });
  }
}

function beginExam(){
  state.examQuestions = pickExamSet(state.setup.count);
  state.answers = {};
  state.graded = {};
  state.flags = {};
  state.current = 0;
  state.startTime = Date.now();
  state.endTime = null;
  state.showFeedback = false;
  state.secondsLeft = state.setup.mode==='exam' ? state.setup.timerMin*60 : null;
  clearInterval(state.timerId);
  if(state.setup.mode==='exam'){
    state.timerId = setInterval(()=>{
      state.secondsLeft--;
      if(state.secondsLeft<=0){
        clearInterval(state.timerId);
        finishExam();
        return;
      }
      updateTimerDisplay();
    },1000);
  }
  setPage('exam');
}

function updateTimerDisplay(){
  const el = document.getElementById('timerVal');
  if(!el) return;
  const m = Math.floor(state.secondsLeft/60);
  const s = state.secondsLeft%60;
  el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  el.classList.toggle('low', state.secondsLeft<=60);
}

function fmtType(t){
  return {mcq:'Multiple Choice',tf:'True / False',fill:'Fill in the Blank',select:'Select All That Apply',
    match:'Match the Following',order:'Arrange in Order',short:'Short Answer',compare:'Compare & Choose'}[t] || t;
}

function renderExam(){
  const qs = state.examQuestions;
  const idx = state.current;
  const q = qs[idx];
  const answered = Object.keys(state.answers).length;
  const pct = Math.round(((idx)/qs.length)*100);

  app.innerHTML = `
    <div class="exam-head">
      <div class="progress-row">
        <span>Question ${idx+1} / ${qs.length}</span>
        ${state.setup.mode==='exam' ? `<span class="timer" id="timerVal">--:--</span>` : `<span style="color:var(--cyan);">Practice Mode</span>`}
        <span>Answered: ${answered}/${qs.length}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="card">
      <div class="qtag">
        <span class="badge ${q.d}">${q.d}</span>
        <span class="badge topic">${q.topic}</span>
        <span>${fmtType(q.t)}</span>
      </div>
      <p class="qtext">${q.q}</p>
      <div id="qBody"></div>
      <div id="feedbackSlot"></div>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="prevBtn" ${idx===0?'disabled':''}>← Previous</button>
      <span class="spacer"></span>
      <button class="btn btn-ghost" id="skipBtn">Skip</button>
      ${idx<qs.length-1 ? `<button class="btn btn-primary" id="nextBtn">Next →</button>` : `<button class="btn btn-primary" id="submitBtn">Submit Exam</button>`}
    </div>
  `;
  renderQuestionBody(q);
  if(state.setup.mode==='exam') updateTimerDisplay();

  document.getElementById('prevBtn').onclick = ()=>{ state.current--; renderExam(); };
  document.getElementById('skipBtn').onclick = ()=>{
    delete state.answers[q.id];
    if(state.current<qs.length-1){ state.current++; renderExam(); } else { finishExam(); }
  };
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.onclick = ()=>{ state.current++; state.showFeedback=false; renderExam(); };
  const submitBtn = document.getElementById('submitBtn');
  if(submitBtn) submitBtn.onclick = ()=> finishExam();
}

function renderQuestionBody(q){
  const body = document.getElementById('qBody');
  const existing = state.answers[q.id];

  if(q.t==='mcq' || q.t==='tf' || q.t==='compare'){
    body.innerHTML = `<div class="choices">${q.o.map((opt,i)=>`
      <div class="choice radio" data-i="${i}">
        <div class="mark">${existing===i?'✓':''}</div>
        <div>${opt}</div>
      </div>`).join('')}</div>`;
    body.querySelectorAll('.choice').forEach(el=>{
      if(parseInt(el.getAttribute('data-i'))===existing) el.classList.add('chosen');
      el.onclick = ()=>{
        state.answers[q.id] = parseInt(el.getAttribute('data-i'));
        if(state.setup.mode==='practice'){ gradeAndShow(q); }
        else { renderQuestionBody(q); }
      };
    });
  }

  else if(q.t==='select'){
    const sel = existing || [];
    body.innerHTML = `<div class="choices">${q.o.map((opt,i)=>`
      <div class="choice" data-i="${i}">
        <div class="mark">${sel.includes(i)?'✓':''}</div>
        <div>${opt}</div>
      </div>`).join('')}</div>
      <div style="margin-top:14px;"><button class="btn btn-sm btn-ghost" id="checkSelect">Check Answer</button></div>`;
    body.querySelectorAll('.choice').forEach(el=>{
      const i = parseInt(el.getAttribute('data-i'));
      if(sel.includes(i)) el.classList.add('chosen');
      el.onclick = ()=>{
        let cur = state.answers[q.id] || [];
        if(cur.includes(i)) cur = cur.filter(x=>x!==i); else cur = [...cur,i];
        state.answers[q.id] = cur.sort((a,b)=>a-b);
        renderQuestionBody(q);
      };
    });
    const btn = document.getElementById('checkSelect');
    if(btn) btn.onclick = ()=>{ if(state.setup.mode==='practice') gradeAndShow(q); };
  }

  else if(q.t==='fill'){
    body.innerHTML = `<input class="fillbox" type="text" placeholder="Type your answer..." value="${existing||''}">
      <div style="margin-top:14px;"><button class="btn btn-sm btn-ghost" id="checkFill">Check Answer</button></div>`;
    const input = body.querySelector('input');
    input.oninput = ()=>{ state.answers[q.id] = input.value; };
    document.getElementById('checkFill').onclick = ()=>{
      if(state.setup.mode==='practice') gradeAndShow(q);
    };
  }

  else if(q.t==='short'){
    body.innerHTML = `<textarea class="fillbox" placeholder="Write your answer here (self-graded against the model answer)...">${existing&&existing.text||''}</textarea>
      <div style="margin-top:14px;"><button class="btn btn-sm btn-ghost" id="revealShort">Reveal Model Answer</button></div>
      <div id="shortReveal"></div>`;
    const ta = body.querySelector('textarea');
    ta.oninput = ()=>{ state.answers[q.id] = {...(state.answers[q.id]||{}), text: ta.value}; };
    document.getElementById('revealShort').onclick = ()=>{
      document.getElementById('shortReveal').innerHTML = `
        <div class="feedback-box ok" style="margin-top:14px;">
          <b>Model answer</b>${q.a}
        </div>
        <div style="display:flex;gap:10px;margin-top:10px;">
          <button class="btn btn-sm btn-ghost" id="markRight">I got this right</button>
          <button class="btn btn-sm btn-ghost" id="markWrong">I got this wrong</button>
        </div>`;
      document.getElementById('markRight').onclick = ()=>{
        state.answers[q.id] = {...(state.answers[q.id]||{}), self:true};
        state.graded[q.id] = true;
        if(state.setup.mode==='practice') renderExam();
      };
      document.getElementById('markWrong').onclick = ()=>{
        state.answers[q.id] = {...(state.answers[q.id]||{}), self:false};
        state.graded[q.id] = false;
        if(state.setup.mode==='practice') renderExam();
      };
    };
  }

  else if(q.t==='match'){
    const ans = existing || {};
    body.innerHTML = q.pairs.map((p,i)=>`
      <div class="match-row">
        <div class="match-left">${p[0]}</div>
        <select class="mselect" data-i="${i}">
          <option value="">— choose —</option>
          ${q.rightShuffled.map((r,ri)=>`<option value="${ri}" ${ans[i]===ri?'selected':''}>${r}</option>`).join('')}
        </select>
      </div>`).join('') + `<div style="margin-top:14px;"><button class="btn btn-sm btn-ghost" id="checkMatch">Check Answer</button></div>`;
    body.querySelectorAll('select').forEach(sel=>{
      sel.onchange = ()=>{
        const i = parseInt(sel.getAttribute('data-i'));
        const cur = state.answers[q.id] || {};
        cur[i] = parseInt(sel.value);
        state.answers[q.id] = cur;
      };
    });
    document.getElementById('checkMatch').onclick = ()=>{
      if(state.setup.mode==='practice') gradeAndShow(q);
    };
  }

  else if(q.t==='order'){
    const ans = existing || {};
    body.innerHTML = q.displaySteps.map((s,i)=>`
      <div class="order-row">
        <select class="mselect" data-i="${i}">
          <option value="">#</option>
          ${q.displaySteps.map((_,n)=>`<option value="${n+1}" ${ans[i]===n+1?'selected':''}>${n+1}</option>`).join('')}
        </select>
        <div class="match-left">${s}</div>
      </div>`).join('') + `<div style="margin-top:14px;"><button class="btn btn-sm btn-ghost" id="checkOrder">Check Answer</button></div>`;
    body.querySelectorAll('select').forEach(sel=>{
      sel.onchange = ()=>{
        const i = parseInt(sel.getAttribute('data-i'));
        const cur = state.answers[q.id] || {};
        cur[i] = parseInt(sel.value);
        state.answers[q.id] = cur;
      };
    });
    document.getElementById('checkOrder').onclick = ()=>{
      if(state.setup.mode==='practice') gradeAndShow(q);
    };
  }
}

function isCorrect(q, ans){
  if(ans===undefined || ans===null) return false;
  if(q.t==='mcq' || q.t==='tf' || q.t==='compare') return ans===q.c;
  if(q.t==='select'){
    if(!Array.isArray(ans)) return false;
    const a = [...ans].sort((x,y)=>x-y), c = [...q.c].sort((x,y)=>x-y);
    return a.length===c.length && a.every((v,i)=>v===c[i]);
  }
  if(q.t==='fill'){
    if(typeof ans!=='string') return false;
    const norm = s=>s.trim().toLowerCase().replace(/[^a-z0-9. ]/g,'');
    return q.a.some(acc=>norm(acc)===norm(ans));
  }
  if(q.t==='match'){
    if(!ans) return false;
    return q.pairs.every((p,i)=> q.rightShuffled[ans[i]] === p[1]);
  }
  if(q.t==='order'){
    if(!ans) return false;
    // correct means displaySteps sorted by ans number equals q.steps original order
    const n = q.displaySteps.length;
    for(let i=0;i<n;i++){ if(!ans[i]) return false; }
    const arranged = [...Array(n).keys()].sort((a,b)=>ans[a]-ans[b]).map(i=>q.displaySteps[i]);
    return arranged.every((s,i)=>s===q.steps[i]);
  }
  if(q.t==='short'){
    return ans && ans.self===true;
  }
  return false;
}

function gradeAndShow(q){
  const ans = state.answers[q.id];
  const correct = isCorrect(q, ans);
  state.graded[q.id] = correct;
  renderQuestionBody(q);
  // highlight
  if(q.t==='mcq'||q.t==='tf'||q.t==='compare'||q.t==='select'){
    document.querySelectorAll('.choice').forEach(el=>{
      const i = parseInt(el.getAttribute('data-i'));
      const isC = Array.isArray(q.c) ? q.c.includes(i) : q.c===i;
      if(isC) el.classList.add('correct');
      else if(Array.isArray(ans)? ans.includes(i) : ans===i) el.classList.add('incorrect');
    });
  }
  const slot = document.getElementById('feedbackSlot');
  let correctText = '';
  if(q.t==='fill') correctText = `Correct answer: <b>${q.a[0]}</b>`;
  if(q.t==='match') correctText = q.pairs.map(p=>`${p[0]} → ${p[1]}`).join(' · ');
  if(q.t==='order') correctText = q.steps.map((s,i)=>`${i+1}. ${s}`).join('<br>');
  slot.innerHTML = `<div class="feedback-box ${correct?'ok':'bad'}">
    <b>${correct?'Correct':'Not quite'}</b>
    ${correctText?correctText+'<br><br>':''}${q.e}
  </div>`;
}

function finishExam(){
  clearInterval(state.timerId);
  state.endTime = Date.now();
  // grade any auto-gradable unanswered/answered items not yet graded
  state.examQuestions.forEach(q=>{
    if(q.t==='short') return; // self-graded already, or ungraded = wrong
    const ans = state.answers[q.id];
    state.graded[q.id] = isCorrect(q, ans);
  });
  setPage('results');
}

function renderResults(){
  const qs = state.examQuestions;
  let correct=0, wrong=0, skipped=0;
  qs.forEach(q=>{
    const has = state.answers[q.id]!==undefined && !(q.t==='short' && !state.answers[q.id]?.text && state.answers[q.id]?.self===undefined);
    if(!has){ skipped++; return; }
    if(state.graded[q.id]) correct++; else wrong++;
  });
  const total = qs.length;
  const pct = Math.round((correct/total)*100);
  const pass = pct>=60;
  const elapsedSec = Math.round(((state.endTime||Date.now())-state.startTime)/1000);
  const mm = Math.floor(elapsedSec/60), ss = elapsedSec%60;

  app.innerHTML = `
    <div class="card score-hero">
      <div class="score-ring" style="--pct:${pct}"><div class="num">${pct}%</div><div class="lbl">SCORE</div></div>
      <div class="pass-tag ${pass?'pass':'fail'}">${pass?'PASS':'FAIL'}</div>
    </div>
    <div class="metric-grid">
      <div class="metric"><div class="v cyan">${correct}/${total}</div><div class="k">Score</div></div>
      <div class="metric"><div class="v ok">${correct}</div><div class="k">Correct</div></div>
      <div class="metric"><div class="v bad">${wrong}</div><div class="k">Wrong</div></div>
      <div class="metric"><div class="v warn">${skipped}</div><div class="k">Skipped</div></div>
      <div class="metric"><div class="v">${mm}:${ss.toString().padStart(2,'0')}</div><div class="k">Time Taken</div></div>
    </div>
    <div style="display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="setPage('review')">Review Answers →</button>
      <button class="btn btn-ghost" onclick="setPage('setup')">Take Another Exam</button>
      <button class="btn btn-ghost" onclick="setPage('home')">Back Home</button>
    </div>
  `;
}

function renderReview(){
  const qs = state.examQuestions;
  app.innerHTML = `<h2 style="font-family:var(--serif);color:#f2f9ff;margin-bottom:4px;">Review</h2>
    <p style="color:var(--text-dim);font-size:13.5px;margin-bottom:22px;">Every question, your answer, the correct answer, and why — sourced only from the chapter.</p>
    <div id="revList"></div>
    <div style="display:flex;gap:12px;margin-top:10px;">
      <button class="btn btn-ghost" onclick="setPage('results')">← Back to Results</button>
      <button class="btn btn-primary" onclick="setPage('setup')">Take Another Exam</button>
    </div>`;
  const list = document.getElementById('revList');
  list.innerHTML = qs.map(q=>{
    const ans = state.answers[q.id];
    const has = ans!==undefined && !(q.t==='short' && !ans?.text && ans?.self===undefined);
    const correct = has ? state.graded[q.id] : false;
    const status = !has ? 'skip' : (correct ? 'right':'wrong');
    const statusLabel = !has ? 'Skipped' : (correct?'Correct':'Wrong');

    let yourAnsText='—', correctAnsText='';
    if(q.t==='mcq'||q.t==='tf'||q.t==='compare'){
      yourAnsText = has? q.o[ans] : '—';
      correctAnsText = q.o[q.c];
    } else if(q.t==='select'){
      yourAnsText = has? ans.map(i=>q.o[i]).join('; ') : '—';
      correctAnsText = q.c.map(i=>q.o[i]).join('; ');
    } else if(q.t==='fill'){
      yourAnsText = has? ans : '—';
      correctAnsText = q.a[0];
    } else if(q.t==='match'){
      yourAnsText = has? q.pairs.map((p,i)=> ans[i]!==undefined ? `${p[0]} → ${q.rightShuffled[ans[i]]}` : `${p[0]} → ?`).join('<br>') : '—';
      correctAnsText = q.pairs.map(p=>`${p[0]} → ${p[1]}`).join('<br>');
    } else if(q.t==='order'){
      if(has){
        const n = q.displaySteps.length;
        const arranged = [...Array(n).keys()].sort((a,b)=>(ans[a]||99)-(ans[b]||99)).map(i=>q.displaySteps[i]);
        yourAnsText = arranged.map((s,i)=>`${i+1}. ${s}`).join('<br>');
      } else yourAnsText='—';
      correctAnsText = q.steps.map((s,i)=>`${i+1}. ${s}`).join('<br>');
    } else if(q.t==='short'){
      yourAnsText = has? (ans.text || (ans.self? '(marked correct)':'(marked wrong)')) : '—';
      correctAnsText = q.a;
    }

    return `<div class="rev-item">
      <span class="status ${status}">${statusLabel}</span>
      <span class="badge topic" style="margin-left:8px;">${q.topic}</span>
      <div class="rev-q">${q.q}</div>
      <div class="rev-block"><b>Your answer:</b><span class="rev-ans">${yourAnsText}</span></div>
      <div class="rev-block"><b>Correct answer:</b><span class="rev-ans">${correctAnsText}</span></div>
      <div class="rev-explain">${q.e}</div>
    </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
