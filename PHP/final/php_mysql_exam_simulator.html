<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHP &amp; MySQL — Exam Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121821;
      --surface2: #182130;
      --surface3: #1e2938;
      --border: #26313f;
      --border-soft: #1b2531;
      --text: #e7edf4;
      --text-dim: #8ea0b3;
      --text-faint: #5c6b7a;
      --accent: #e3b341;
      --accent-dim: #8a6a26;
      --blue: #5cadff;
      --blue-dim: #26445e;
      --green: #3fbf7f;
      --green-dim: #1c4632;
      --red: #f76464;
      --red-dim: #4a2222;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      --sans: 'Space Grotesk', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(circle at 15% 0%, rgba(92, 173, 255, 0.06), transparent 40%),
        radial-gradient(circle at 85% 15%, rgba(227, 179, 65, 0.05), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      line-height: 1.5;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-dim);
      padding-bottom: 18px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border-soft);
    }

    .topbar .prompt {
      color: var(--green);
    }

    .topbar .prompt .caret {
      display: inline-block;
      width: 8px;
      height: 15px;
      background: var(--accent);
      margin-left: 4px;
      vertical-align: -2px;
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .pill {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--text-dim);
      background: var(--surface2);
    }

    /* ---------- START SCREEN ---------- */
    .hero {
      padding: 40px 4px 10px;
    }

    .hero h1 {
      font-size: clamp(28px, 4.2vw, 42px);
      margin: 0 0 10px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .hero h1 .accent {
      color: var(--accent);
    }

    .hero p.sub {
      color: var(--text-dim);
      font-size: 16px;
      max-width: 640px;
      margin: 0 0 28px;
    }

    .terminal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: var(--mono);
      font-size: 13.5px;
      color: var(--text-dim);
      padding: 18px 20px;
      margin-bottom: 28px;
      overflow-x: auto;
    }

    .terminal-card .line {
      white-space: pre;
    }

    .terminal-card .green {
      color: var(--green);
    }

    .terminal-card .amber {
      color: var(--accent);
    }

    .terminal-card .blue {
      color: var(--blue);
    }

    .dist-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 30px;
    }

    @media (max-width:700px) {
      .dist-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .dist-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .dist-item .num {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .dist-item .label {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .dist-item .bar {
      height: 4px;
      border-radius: 2px;
      background: var(--surface3);
      margin-top: 8px;
      overflow: hidden;
    }

    .dist-item .bar>div {
      height: 100%;
      background: var(--blue);
    }

    .rules {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 22px;
      margin-bottom: 30px;
    }

    .rules h3 {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    .rules ul {
      margin: 0;
      padding-left: 18px;
      color: var(--text);
      font-size: 14.5px;
    }

    .rules li {
      margin-bottom: 6px;
    }

    .rules li::marker {
      color: var(--accent);
    }

    .btn {
      font-family: var(--sans);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 13px 26px;
      transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #1a1200;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(227, 179, 65, 0.25);
    }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      background: var(--surface3);
    }

    .btn-danger {
      background: var(--red);
      color: #2a0d0d;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ---------- EXAM SCREEN ---------- */
    .exam-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .qcounter {
      font-family: var(--mono);
      font-size: 14px;
      color: var(--text-dim);
    }

    .qcounter b {
      color: var(--text);
    }

    .timer {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 7px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    .timer.low {
      color: var(--red);
      border-color: var(--red-dim);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: 0.55;
      }
    }

    .progress-track {
      height: 6px;
      border-radius: 3px;
      background: var(--surface2);
      overflow: hidden;
      margin-bottom: 26px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--accent));
      transition: width .25s ease;
    }

    .exam-layout {
      display: grid;
      grid-template-columns: 1fr 250px;
      gap: 22px;
      align-items: start;
    }

    @media (max-width:820px) {
      .exam-layout {
        grid-template-columns: 1fr;
      }
    }

    .qcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 26px 28px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
    }

    .qtags {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tag {
      font-family: var(--mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 9px;
      border-radius: 20px;
    }

    .tag-topic {
      background: var(--blue-dim);
      color: var(--blue);
    }

    .tag-diff-easy {
      background: var(--green-dim);
      color: var(--green);
    }

    .tag-diff-medium {
      background: #3a3320;
      color: var(--accent);
    }

    .tag-diff-hard {
      background: var(--red-dim);
      color: var(--red);
    }

    .tag-type {
      background: var(--surface3);
      color: var(--text-dim);
    }

    .qprompt {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
      line-height: 1.55;
    }

    .codeblock {
      background: #0a0e13;
      border: 1px solid var(--border-soft);
      border-radius: 9px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .codeblock .filetab {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-faint);
      padding: 7px 14px;
      border-bottom: 1px solid var(--border-soft);
      background: #0d1219;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .codeblock .filetab .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-faint);
    }

    .codeblock pre {
      margin: 0;
      padding: 16px 18px;
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.65;
      overflow-x: auto;
      color: var(--text);
    }

    .tok-kw {
      color: #ff7ab2;
    }

    .tok-string {
      color: var(--green);
    }

    .tok-var {
      color: var(--blue);
    }

    .tok-num {
      color: var(--accent);
    }

    .tok-comment {
      color: var(--text-faint);
      font-style: italic;
    }

    .tok-ident {
      color: #c792ea;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 18px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }

    .opt:hover {
      border-color: var(--blue-dim);
      background: var(--surface3);
    }

    .opt.selected {
      border-color: var(--blue);
      background: #132133;
    }

    .opt .box {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin-top: 1px;
      border: 1.5px solid var(--text-faint);
      background: transparent;
    }

    .opt .box.radio {
      border-radius: 50%;
    }

    .opt .box.check {
      border-radius: 4px;
    }

    .opt.selected .box {
      border-color: var(--blue);
      background: var(--blue);
    }

    .opt .otext {
      font-family: var(--mono);
      font-size: 14.5px;
      color: var(--text);
      white-space: pre-wrap;
    }

    .qcard-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 8px;
      flex-wrap: wrap;
    }

    .mark-btn {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .mark-btn.active {
      background: var(--surface3);
      color: var(--accent);
      border-color: var(--accent-dim);
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    /* nav panel */
    .navpanel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      position: sticky;
      top: 20px;
    }

    .navpanel h4 {
      margin: 0 0 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    .navgrid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }

    .navcell {
      aspect-ratio: 1;
      border-radius: 5px;
      background: var(--surface2);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      cursor: pointer;
    }

    .navcell.answered {
      background: var(--blue-dim);
      color: var(--blue);
      border-color: var(--blue-dim);
    }

    .navcell.marked {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .navcell.current {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .legend {
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 16px;
    }

    .legend span.sw {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: -1px;
    }

    /* ---------- RESULTS ---------- */
    .score-hero {
      display: flex;
      align-items: center;
      gap: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 30px 32px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border: 6px solid var(--surface3);
      position: relative;
      flex: 0 0 auto;
    }

    .score-circle .pct {
      font-family: var(--mono);
      font-size: 26px;
      font-weight: 700;
    }

    .score-circle .frac {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
    }

    .score-meta {
      flex: 1;
      min-width: 220px;
    }

    .score-meta h2 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .score-meta p {
      margin: 0;
      color: var(--text-dim);
      font-size: 14px;
    }

    .score-stats {
      display: flex;
      gap: 22px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .score-stats div {
      font-size: 13px;
      color: var(--text-dim);
    }

    .score-stats b {
      display: block;
      font-family: var(--mono);
      font-size: 18px;
      color: var(--text);
      font-weight: 700;
    }

    .topic-breakdown {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 24px;
    }

    .topic-breakdown h3 {
      margin: 0 0 16px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    .topic-row {
      display: grid;
      grid-template-columns: 150px 1fr 50px;
      align-items: center;
      gap: 12px;
      margin-bottom: 11px;
      font-size: 13px;
    }

    .topic-row .tname {
      color: var(--text);
    }

    .topic-row .tbar {
      height: 8px;
      border-radius: 4px;
      background: var(--surface3);
      overflow: hidden;
    }

    .topic-row .tbar>div {
      height: 100%;
    }

    .topic-row .tpct {
      font-family: var(--mono);
      text-align: right;
      color: var(--text-dim);
    }

    .recommend {
      background: linear-gradient(135deg, rgba(227, 179, 65, 0.08), rgba(92, 173, 255, 0.05));
      border: 1px solid var(--accent-dim);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 28px;
      font-size: 14.5px;
    }

    .recommend b {
      color: var(--accent);
    }

    .review-toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      font-family: var(--mono);
      font-size: 12px;
      padding: 7px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #1a1200;
      border-color: var(--accent);
    }

    .review-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      border-radius: 10px;
      padding: 20px 22px;
      margin-bottom: 14px;
    }

    .review-item.correct {
      border-left-color: var(--green);
    }

    .review-item.incorrect {
      border-left-color: var(--red);
    }

    .review-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .verdict {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .verdict.correct {
      background: var(--green-dim);
      color: var(--green);
    }

    .verdict.incorrect {
      background: var(--red-dim);
      color: var(--red);
    }

    .review-ans {
      font-size: 14px;
      margin: 6px 0;
      font-family: var(--mono);
    }

    .review-ans .lbl {
      color: var(--text-faint);
      font-family: var(--sans);
    }

    .review-ans.your-wrong {
      color: var(--red);
    }

    .review-ans.your-right {
      color: var(--green);
    }

    .review-ans.correct-ans {
      color: var(--green);
    }

    .explain {
      margin-top: 10px;
      padding: 12px 14px;
      background: var(--surface2);
      border-radius: 8px;
      font-size: 13.5px;
      color: var(--text-dim);
    }

    .explain b {
      color: var(--text);
    }

    .trap-tag {
      display: inline-block;
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      background: #2a2210;
      padding: 2px 9px;
      border-radius: 20px;
    }

    .bottom-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 30px;
    }

    .hidden {
      display: none !important;
    }

    /* modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 12, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .modal {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 26px 28px;
      max-width: 420px;
      width: 100%;
    }

    .modal h3 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .modal p {
      color: var(--text-dim);
      font-size: 14px;
      margin: 0 0 20px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
  </style>
</head>

<body>
  <div class="bg-grid"></div>
  <div class="wrap" id="app"></div>

  <script>
    /* =========================================================
       QUESTION BANK — 40 questions
       ========================================================= */
    const QUESTIONS = [

      /* ---------------- PHP CHAPTER 1 (10) ---------------- */
      {
        topic: "PHP Ch1", type: "single", difficulty: "easy", lang: "php",
        code: "$name = \"Ali\";\necho \"$name\";",
        prompt: "What is the exact output of this code?",
        options: ["Ali", "$name", "Parse error", "AliAli"], correct: 0,
        explanation: "Double-quoted strings in PHP interpolate variables, so <b>$name</b> is replaced with its value, <b>Ali</b>.",
        trap: "String Interpolation"
      },

      {
        topic: "PHP Ch1", type: "single", difficulty: "hard", lang: "php",
        code: "$name = \"Ali\";\necho '$name';",
        prompt: "What is the exact output of this code?",
        options: ["Ali", "$name", "Undefined variable warning, prints nothing", "AliAli"], correct: 1,
        explanation: "Single-quoted strings do <b>not</b> interpolate variables — <b>$name</b> is printed literally as text, dollar sign and all.",
        trap: "Single vs Double Quotes"
      },

      {
        topic: "PHP Ch1", type: "single", difficulty: "hard", lang: "php",
        code: "$a = \"5\";\n$b = \"3\";\necho $a . $b;\necho \"<br>\";\necho $a + $b;",
        prompt: "What is printed on each line?",
        options: ["53 then 8", "8 then 53", "53 then 53", "8 then 8"], correct: 0,
        explanation: "<b>.</b> is the string concatenation operator ('5'.'3' = '53'). <b>+</b> performs arithmetic — PHP converts the numeric strings to numbers first, so 5+3 = 8.",
        trap: "Concatenation ( . ) vs Addition ( + )"
      },

      {
        topic: "PHP Ch1", type: "single", difficulty: "hard", lang: "php",
        code: "$name = \"Ali\";\necho $Name;",
        prompt: "What is the exact output of this code?",

    /* =========================================================
       SYNTAX HIGHLIGHTING
       ========================================================= */
    function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function highlightCode(code, lang) {
      let s = esc(code);
      const stash = [];
      // FIX: the placeholder wraps the stash index in letters (X...Y) rather than
      // leaving the digits bounded only by \u0000/\u0001. Previously the bare
      // digits were themselves matched by the later \b\d+\b number-highlighting
      // regex (control chars count as word-boundary-adjacent non-word chars),
      // which corrupted the placeholder so the final unstash regex could never
      // find it again — the string literal was permanently replaced by its own
      // stash index (e.g. "Guest" -> "0", "Sara" -> "2"). Wrapping the digits in
      // word characters removes the \b boundary the number regex relies on.
      const put = (m) => { stash.push(m); return "\u0000X" + (stash.length - 1) + "Y\u0001"; };

      if (lang === 'php') {
        s = s.replace(/"([^"\\]|\\.)*"/g, m => put('<span class="tok-string">' + m + '</span>'));
        s = s.replace(/'([^'\\]|\\.)*'/g, m => put('<span class="tok-string">' + m + '</span>'));
        s = s.replace(/\$[A-Za-z_][A-Za-z0-9_]*/g, m => '<span class="tok-var">' + m + '</span>');
        s = s.replace(/\b\d+(\.\d+)?\b/g, m => '<span class="tok-num">' + m + '</span>');
        const kw = ['echo', 'function', 'return', 'if', 'else', 'elseif', 'while', 'for', 'foreach', 'as', 'break', 'continue', 'switch', 'case', 'default', 'array', 'global'];
        s = s.replace(new RegExp('\\b(' + kw.join('|') + ')\\b', 'g'), '<span class="tok-kw">$1</span>');
      } else if (lang === 'sql') {
        s = s.replace(/'([^'\\]|\\.)*'/g, m => put('<span class="tok-string">' + m + '</span>'));
        s = s.replace(/`[^`]*`/g, m => put('<span class="tok-ident">' + m + '</span>'));
        s = s.replace(/\b\d+\b/g, m => '<span class="tok-num">' + m + '</span>');
        const kw = ['SELECT', 'FROM', 'WHERE', 'ORDER', 'BY', 'GROUP', 'UPDATE', 'SET', 'DELETE', 'INSERT', 'INTO', 'VALUES', 'CREATE', 'TABLE', 'DATABASE', 'DROP', 'GRANT', 'REVOKE', 'SHOW', 'DESCRIBE', 'LIMIT', 'COUNT', 'AND', 'OR', 'NOT', 'AS', 'PRIMARY', 'KEY', 'ALTER', 'mysql'];
        s = s.replace(new RegExp('\\b(' + kw.join('|') + ')\\b', 'gi'), m => '<span class="tok-kw">' + m + '</span>');
      }
      s = s.replace(/\u0000X(\d+)Y\u0001/g, (_, i) => stash[Number(i)]);
      return s;
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildExam() {
      const qs = shuffle(QUESTIONS).map((q, idx) => {
        const optIdx = shuffle(q.options.map((_, i) => i));
        const newOptions = optIdx.map(i => q.options[i]);
        let correct, correctMulti;
        if (q.type === 'multi') {
          correctMulti = q.correctMulti.map(orig => optIdx.indexOf(orig)).sort((a, b) => a - b);
        } else {
          correct = optIdx.indexOf(q.correct);
        }
        return Object.assign({}, q, { options: newOptions, correct, correctMulti, examId: idx });
      });
      return {
        questions: qs,
        answers: {},        // examId -> number or array of numbers
        marked: new Set(),
        current: 0,
        timeLeft: TIME_LIMIT,
        timerHandle: null,
        submitted: false,
        reviewFilter: 'all'
      };
    }

    <div class="hero">
      <h1>PHP &amp; MySQL <span class="accent">Exam Simulator</span></h1>
      <p class="sub">40 questions covering PHP Chapters 1, 3, 4, 5 and MySQL Chapters 8–11. Built in the style of your professor's previous exams — expect small, deliberate traps.</p>
    </div>

    <div class="terminal-card">
      <div class="line"><span class="green">$</span> cat syllabus.txt</div>
      <div class="line">  PHP  → Crash Course · Arrays · Strings · Functions</div>
      <div class="line">  SQL  → DB Design · Creating DBs · Queries · PHP+MySQL</div>
      <div class="line"><span class="amber">$</span> echo "Read every character before answering."</div>
    </div>

    <div class="dist-grid">
      ${TOPIC_ORDER.map(t => `
        <div class="dist-item">
          <div class="num">${counts[t]}</div>
          <div class="label">${t}</div>
          <div class="bar"><div style="width:${(counts[t] / 10 * 100)}%"></div></div>
        </div>
      `).join('')}
    </div>

    <div class="rules">
      <h3>Exam Rules</h3>
      <ul>
        <li>45-minute timer, auto-submits when time runs out.</li>
        <li>Single-choice, multiple-choice, and true/false questions — read the prompt carefully.</li>
        <li>No feedback is shown during the exam. Full explanations appear after you submit.</li>
        <li>Use "Mark for review" to flag questions and revisit them before submitting.</li>
        <li>Question and answer order is shuffled each time you start.</li>
      </ul>
    </div>

    <button class="btn btn-primary" onclick="startExam()">Start Exam →</button>
  `;
    }

    /* =========================================================
       RENDER: EXAM SCREEN
       ========================================================= */
    function startExam() {
      state = buildExam();
      state.timerHandle = setInterval(tick, 1000);
      renderExam();
    }

    function tick() {
      state.timeLeft--;
      if (state.timeLeft <= 0) {
        clearInterval(state.timerHandle);
        state.timeLeft = 0;
        submitExam(true);
        return;
      }
      const el = document.getElementById('timerDisplay');
      if (el) updateTimerDisplay();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return m + ':' + s;
    }

    function updateTimerDisplay() {
      const el = document.getElementById('timerDisplay');
      if (!el) return;
      el.textContent = formatTime(state.timeLeft);
      el.parentElement.classList.toggle('low', state.timeLeft <= 60);
    }

    function renderExam() {
      const q = state.questions[state.current];
      const total = state.questions.length;
      const answeredCount = Object.keys(state.answers).length;

      const app = document.getElementById('app');
      app.innerHTML = `
    <div class="exam-header">
      <div class="qcounter">Question <b>${state.current + 1}</b> / ${total} &nbsp;·&nbsp; <b>${answeredCount}</b> answered</div>
      <div class="timer"><span id="timerDisplay">${formatTime(state.timeLeft)}</span></div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${((state.current + 1) / total * 100)}%"></div></div>

    <div class="exam-layout">
      <div class="qcard">
        <div class="qtags">
          <span class="tag tag-topic">${q.topic}</span>
          <span class="tag tag-diff-${q.difficulty}">${q.difficulty}</span>
          <span class="tag tag-type">${q.type === 'multi' ? 'Multiple Choice' : (q.options.length === 2 ? 'True / False' : 'Single Choice')}</span>
        </div>
        <div class="qprompt">${q.prompt}</div>
        ${renderTable(q)}
        ${q.code ? renderCode(q) : ''}
        <div class="options">${renderOptions(q)}</div>
        <div class="qcard-footer">
          <button class="mark-btn ${state.marked.has(q.examId) ? 'active' : ''}" onclick="toggleMark()">${state.marked.has(q.examId) ? '★ Marked for review' : '☆ Mark for review'}</button>
          <div class="nav-buttons">
            <button class="btn btn-ghost" ${state.current === 0 ? 'disabled' : ''} onclick="goTo(${state.current - 1})">← Previous</button>
            ${state.current === total - 1
          ? `<button class="btn btn-primary" onclick="confirmSubmit()">Submit Exam</button>`
          : `<button class="btn btn-primary" onclick="goTo(${state.current + 1})">Next →</button>`}
          </div>
        </div>
      </div>

      <div class="navpanel">
        <h4>Question Navigator</h4>
        <div class="navgrid">
          ${state.questions.map((qq, i) => `
            <div class="navcell ${state.answers[qq.examId] !== undefined ? 'answered' : ''} ${state.marked.has(qq.examId) ? 'marked' : ''} ${i === state.current ? 'current' : ''}"
                 onclick="goTo(${i})">${i + 1}</div>
          `).join('')}
        </div>
        <div class="legend">
          <div><span class="sw" style="background:var(--blue-dim);"></span>Answered</div>
          <div><span class="sw" style="background:var(--surface2); box-shadow:inset 0 0 0 1px var(--accent);"></span>Marked for review</div>
          <div><span class="sw" style="background:var(--surface2);"></span>Unanswered</div>
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="confirmSubmit()">Submit Exam</button>
      </div>
    </div>
  `;
    }

    function renderTable(q) {
      if (!q.table) return '';
      return `
    <div class="codeblock" style="margin-bottom:14px;">
      <div class="filetab"><span class="dot"></span>students (table)</div>
      <div style="padding:14px 18px; overflow-x:auto;">
        <table style="border-collapse:collapse; font-family:var(--mono); font-size:13.5px; width:100%;">
          <thead><tr>${q.table.cols.map(c => `<th style="text-align:left; padding:6px 14px; border-bottom:1px solid var(--border); color:var(--blue);">${c}</th>`).join('')}</tr></thead>
          <tbody>${q.table.rows.map(r => `<tr>${r.map(c => `<td style="padding:6px 14px; border-bottom:1px solid var(--border-soft); color:var(--text);">${c}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
    </div>
  `;
    }

    function renderCode(q) {
      return `
    <div class="codeblock">
      <div class="filetab"><span class="dot"></span>${q.lang === 'sql' ? 'query.sql' : 'snippet.php'}</div>
      <pre>${highlightCode(q.code, q.lang)}</pre>
    </div>
  `;
    }

    function renderOptions(q) {
      const ans = state.answers[q.examId];
      return q.options.map((opt, i) => {
        const isSelected = q.type === 'multi' ? (ans && ans.includes(i)) : ans === i;
        return `
      <div class="opt ${isSelected ? 'selected' : ''}" onclick="selectOption(${i})">
        <div class="box ${q.type === 'multi' ? 'check' : 'radio'}"></div>
        <div class="otext">${esc(opt)}</div>
      </div>
    `;
      }).join('');
    }

    function selectOption(i) {
      const q = state.questions[state.current];
      if (q.type === 'multi') {
        let cur = state.answers[q.examId] || [];
        cur = cur.includes(i) ? cur.filter(x => x !== i) : [...cur, i].sort((a, b) => a - b);
        if (cur.length === 0) delete state.answers[q.examId];
        else state.answers[q.examId] = cur;
      } else {
        state.answers[q.examId] = i;
      }
      renderExam();
    }

    function toggleMark() {
      const q = state.questions[state.current];
      if (state.marked.has(q.examId)) state.marked.delete(q.examId);
      else state.marked.add(q.examId);
      renderExam();
    }

    function goTo(i) {
      if (i < 0 || i >= state.questions.length) return;
      state.current = i;
      renderExam();
    }

    /* =========================================================
       SUBMIT / MODAL
       ========================================================= */
    function confirmSubmit() {
      const total = state.questions.length;
      const answered = Object.keys(state.answers).length;
      const unanswered = total - answered;
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
    <div class="modal">
      <h3>Submit exam?</h3>
      <p>${unanswered > 0 ? `You have <b style="color:var(--accent)">${unanswered}</b> unanswered question(s). ` : 'All questions are answered. '}Once submitted, you can't change your answers.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">Keep working</button>
        <button class="btn btn-primary" onclick="submitExam()">Submit</button>
      </div>
    </div>
  `;
      document.body.appendChild(overlay);
    }

    function submitExam(auto) {
      document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
      if (state.timerHandle) clearInterval(state.timerHandle);
      state.submitted = true;
      state.timeUsed = TIME_LIMIT - state.timeLeft;
      renderResults();
    }

    /* =========================================================
       RESULTS
       ========================================================= */
    function isCorrect(q) {
      const ans = state.answers[q.examId];
      if (q.type === 'multi') {
        if (!ans) return false;
        if (ans.length !== q.correctMulti.length) return false;
        return ans.every((v, i) => v === q.correctMulti[i]);
      }
      return ans === q.correct;
    }

    function renderResults() {
      const qs = state.questions;
      const total = qs.length;
      let correctCount = 0;
      const topicStats = {};
      TOPIC_ORDER.forEach(t => topicStats[t] = { correct: 0, total: 0 });
      let trickTotal = 0, trickMissed = 0;

      qs.forEach(q => {
        const ok = isCorrect(q);
        if (ok) correctCount++;
        topicStats[q.topic].total++;
        if (ok) topicStats[q.topic].correct++;
        if (q.trap) { trickTotal++; if (!ok) trickMissed++; }
      });

      const pct = Math.round(correctCount / total * 100);
      const unanswered = total - Object.keys(state.answers).length;

      // weakest topic for recommendation
      let weakest = null, weakestPct = 101;
      TOPIC_ORDER.forEach(t => {
        const st = topicStats[t];
        if (st.total === 0) return;
        const p = st.correct / st.total * 100;
        if (p < weakestPct) { weakestPct = p; weakest = t; }
      });

      const scoreColor = pct >= 80 ? 'var(--green)' : pct >= 60 ? 'var(--accent)' : 'var(--red)';

      const app = document.getElementById('app');
      app.innerHTML = `
    <div class="topbar">
      <div class="prompt">student@examhost:~$ ./grade_exam.sh<span class="caret"></span></div>
      <div class="pill">Results</div>
    </div>

    <div class="score-hero">
      <div class="score-circle" style="border-color:${scoreColor};">
        <div class="pct" style="color:${scoreColor};">${pct}%</div>
        <div class="frac">${correctCount}/${total}</div>
      </div>
      <div class="score-meta">
        <h2>${pct >= 80 ? 'Strong performance.' : pct >= 60 ? 'Solid, with room to tighten up.' : 'Needs more practice before the real exam.'}</h2>
        <p>You finished with ${formatTime(state.timeUsed)} used of ${formatTime(TIME_LIMIT)}${unanswered > 0 ? `, and left ${unanswered} question(s) unanswered.` : '.'}</p>
        <div class="score-stats">
          <div><b>${correctCount}</b>Correct</div>
          <div><b>${total - correctCount - unanswered}</b>Incorrect</div>
          <div><b>${unanswered}</b>Unanswered</div>
          <div><b>${trickMissed}/${trickTotal}</b>Trick Q's Missed</div>
        </div>
      </div>
    </div>

    <div class="topic-breakdown">
      <h3>Performance by Topic</h3>
      ${TOPIC_ORDER.map(t => {
        const st = topicStats[t];
        const p = st.total ? Math.round(st.correct / st.total * 100) : 0;
        const barColor = p >= 80 ? 'var(--green)' : p >= 50 ? 'var(--accent)' : 'var(--red)';
        return `
          <div class="topic-row">
            <div class="tname">${t}</div>
            <div class="tbar"><div style="width:${p}%; background:${barColor};"></div></div>
            <div class="tpct">${p}%</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="recommend">
      <b>Recommendation:</b> ${weakest ? `Your weakest area is <b>${weakest}</b> (${Math.round(weakestPct)}%). Revisit that chapter and retry its trick questions below before your next attempt.` : 'Great, balanced performance across all topics.'}
    </div>

    <div class="review-toolbar">
      <button class="filter-btn active" data-f="all" onclick="setReviewFilter('all')">All (${total})</button>
      <button class="filter-btn" data-f="incorrect" onclick="setReviewFilter('incorrect')">Missed (${total - correctCount})</button>
      <button class="filter-btn" data-f="trick" onclick="setReviewFilter('trick')">Trick Questions (${trickTotal})</button>
      <button class="filter-btn" data-f="marked" onclick="setReviewFilter('marked')">Marked (${state.marked.size})</button>
    </div>

    <div id="reviewList"></div>

    <div class="bottom-actions">
      <button class="btn btn-primary" onclick="startExam()">Retake Exam (New Shuffle)</button>
    </div>
  `;
      state.reviewFilter = 'all';
      renderReviewList();
    }

    function setReviewFilter(f) {
      state.reviewFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
      renderReviewList();
    }

    function renderReviewList() {
      const list = document.getElementById('reviewList');
      const f = state.reviewFilter;
      const items = state.questions.filter(q => {
        const ok = isCorrect(q);
        if (f === 'incorrect') return !ok;
        if (f === 'trick') return !!q.trap;
        if (f === 'marked') return state.marked.has(q.examId);
        return true;
      });

      if (items.length === 0) {
        list.innerHTML = `<p style="color:var(--text-dim); text-align:center; padding:30px;">Nothing to show for this filter.</p>`;
        return;
      }

      list.innerHTML = items.map((q) => {
        const idx = state.questions.indexOf(q);
        const ok = isCorrect(q);
        const ans = state.answers[q.examId];
        let yourAnsText, correctAnsText;
        if (q.type === 'multi') {
          yourAnsText = ans ? ans.map(i => q.options[i]).join('; ') : '(none selected)';
          correctAnsText = q.correctMulti.map(i => q.options[i]).join('; ');
        } else {
          yourAnsText = ans !== undefined ? q.options[ans] : '(not answered)';
          correctAnsText = q.options[q.correct];
        }
        return `
      <div class="review-item ${ok ? 'correct' : 'incorrect'}">
        <div class="review-head">
          <div style="font-size:13px; color:var(--text-dim);">Q${idx + 1} · ${q.topic}</div>
          <span class="verdict ${ok ? 'correct' : 'incorrect'}">${ok ? 'Correct' : 'Incorrect'}</span>
        </div>
        <div class="qprompt" style="font-size:15px; margin-bottom:10px;">${q.prompt}</div>
        ${renderTable(q)}
        ${q.code ? renderCode(q) : ''}
        <div class="review-ans ${ok ? 'your-right' : 'your-wrong'}"><span class="lbl">Your answer: </span>${esc(yourAnsText)}</div>
        ${!ok ? `<div class="review-ans correct-ans"><span class="lbl">Correct answer: </span>${esc(correctAnsText)}</div>` : ''}
        <div class="explain"><b>Why:</b> ${q.explanation}</div>
        ${q.trap ? `<div class="trap-tag">Trap Type: ${q.trap}</div>` : ''}
      </div>
    `;
      }).join('');
    }

    /* boot */
    renderStart();
  </script>
</body>

</html>
